<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0e12" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F18774" />
      <stop offset="100%" stop-color="#ED5F45" />
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a1a1aa" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="460" rx="16" fill="url(#bgGrad)" stroke="#232328" stroke-width="1.5" />

  <!-- Top Bar / Window Controls -->
  <circle cx="28" cy="24" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="44" cy="24" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="60" cy="24" r="5" fill="#10b981" opacity="0.8" />
  <text x="440" y="28" text-anchor="middle" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">ai-ui — Component Workbench</text>
  <line x1="0" y1="44" x2="880" y2="44" stroke="#1f1f24" stroke-width="1" />

  <!-- Brand Eyebrow -->
  <rect x="40" y="64" width="28" height="28" rx="8" fill="url(#primaryGrad)" />
  <path d="M48 80l4-8 4 8M50 77h4" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <text x="78" y="83" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.03em">ai-ui</text>
  <rect x="130" y="69" width="76" height="18" rx="9" fill="rgba(237, 95, 69, 0.12)" stroke="rgba(237, 95, 69, 0.25)" stroke-width="1" />
  <text x="168" y="82" text-anchor="middle" fill="#ED5F45" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">ASTRO 5</text>

  <!-- Model Selector Dropdown (Right Top) -->
  <rect x="650" y="64" width="190" height="34" rx="17" fill="#141418" stroke="#2a2a30" stroke-width="1" />
  <circle cx="668" cy="81" r="4" fill="#ED5F45" />
  <text x="682" y="85" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500">Claude 3.5 Sonnet</text>
  <path d="M822 79l4 4 4-4" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 1. Floating Thinking Bar -->
  <g transform="translate(40, 114)">
    <rect width="800" height="46" rx="23" fill="#141418" stroke="#2a2a30" stroke-width="1" />
    <circle cx="30" cy="23" r="8" fill="none" stroke="#2a2a30" stroke-width="2" />
    <path d="M30 15 a8 8 0 0 1 8 8" fill="none" stroke="#ED5F45" stroke-width="2" stroke-linecap="round" />
    <text x="50" y="27" fill="url(#shimmer)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="500">Auditing edge security headers &amp; RFC 8259 single-pass schemas...</text>
    <text x="760" y="27" text-anchor="end" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Agent Trace</text>
  </g>

  <!-- 2. Collapsible Reasoning Card (Left Column) -->
  <g transform="translate(40, 176)">
    <rect width="470" height="182" rx="14" fill="#131316" stroke="#232328" stroke-width="1" />
    <!-- Header -->
    <path d="M22 23l4 4 4-4" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="38" y="26" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Reasoning Complete</text>
    <rect x="180" y="14" width="70" height="18" rx="9" fill="#1a1a1f" stroke="#2a2a30" stroke-width="1" />
    <text x="215" y="27" text-anchor="middle" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="500">3 verified</text>
    <line x1="0" y1="42" x2="470" y2="42" stroke="#1f1f24" stroke-width="1" />

    <!-- Step 1 -->
    <circle cx="26" cy="65" r="7" fill="rgba(237, 95, 69, 0.15)" stroke="#ED5F45" stroke-width="1" />
    <path d="M23 65l2 2 4-4" stroke="#ED5F45" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="42" y="69" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500">TLS 1.3 &amp; Zero-Trust Edge Handshake</text>
    <text x="440" y="69" text-anchor="end" fill="#71717a" font-family="ui-monospace, monospace" font-size="11">124ms</text>

    <!-- Step 2 -->
    <circle cx="26" cy="105" r="7" fill="rgba(237, 95, 69, 0.15)" stroke="#ED5F45" stroke-width="1" />
    <path d="M23 105l2 2 4-4" stroke="#ED5F45" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="42" y="109" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500">RFC 8259 Single-Pass Escaping Validated</text>
    <text x="440" y="109" text-anchor="end" fill="#71717a" font-family="ui-monospace, monospace" font-size="11">310ms</text>

    <!-- Step 3 -->
    <circle cx="26" cy="145" r="7" fill="rgba(237, 95, 69, 0.15)" stroke="#ED5F45" stroke-width="1" />
    <path d="M23 145l2 2 4-4" stroke="#ED5F45" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="42" y="149" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500">WebMCP Tool Registration Verified</text>
    <text x="440" y="149" text-anchor="end" fill="#71717a" font-family="ui-monospace, monospace" font-size="11">280ms</text>
  </g>

  <!-- 3. Tool Call & Output Inspector (Right Column) -->
  <g transform="translate(526, 176)">
    <rect width="314" height="182" rx="14" fill="#131316" stroke="#232328" stroke-width="1" />
    <!-- Header -->
    <text x="18" y="26" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Tool: probe_webmcp</text>
    <rect x="238" y="14" width="60" height="18" rx="9" fill="rgba(237, 95, 69, 0.15)" stroke="#ED5F45" stroke-width="1" />
    <text x="268" y="27" text-anchor="middle" fill="#ED5F45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="600">PASSED</text>
    <line x1="0" y1="42" x2="314" y2="42" stroke="#1f1f24" stroke-width="1" />

    <!-- Code Preview -->
    <rect x="14" y="56" width="286" height="110" rx="8" fill="#0a0a0d" stroke="#1f1f24" stroke-width="1" />
    <text x="24" y="78" fill="#71717a" font-family="ui-monospace, monospace" font-size="11">input: &#123;</text>
    <text x="34" y="96" fill="#ED5F45" font-family="ui-monospace, monospace" font-size="11">"domain": "michaelvereb.com",</text>
    <text x="34" y="114" fill="#a1a1aa" font-family="ui-monospace, monospace" font-size="11">"check": "RFC 8259 JSON-LD"</text>
    <text x="24" y="132" fill="#71717a" font-family="ui-monospace, monospace" font-size="11">&#125;</text>
    <text x="24" y="152" fill="#10b981" font-family="ui-monospace, monospace" font-size="11">→ status: 200 OK (0 double-escapes)</text>
  </g>

  <!-- 4. Prompt Input Bar (Bottom) -->
  <g transform="translate(40, 374)">
    <rect width="800" height="60" rx="14" fill="#131316" stroke="#282830" stroke-width="1" />
    <circle cx="28" cy="30" r="3" fill="#71717a" />
    <text x="44" y="35" fill="#52525b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5">Audit domain (e.g. www.boss-textile.com) or enter agent prompt...</text>
    <rect x="676" y="12" width="112" height="36" rx="18" fill="url(#primaryGrad)" />
    <text x="732" y="35" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="600">Run Audit</text>
  </g>
</svg>
